<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Sin scripts inline: compatible con tu CSP (script-src 'self') -->
<title>Panel de inicio</title>
<link rel="stylesheet" href="home.css">
</head>
<body>

    <video id="backgroundVideo" autoplay muted loop playsinline>
        <source src="assets/videos/index.mp4" type="video/mp4">
    </video>
    <div id="overlay"></div>

    <main class="panel">

        <!-- Servidor -->
        <section class="server glass">
            <img class="logo" src="assets/images/icon.png" alt="">
            <div class="info">
                <div class="name">Minecraft</div>
                <div class="status"><span class="dot"></span> Activo · 0 ms</div>
            </div>
            <div class="players"><b>0</b><small>Online</small></div>
        </section>

        <!-- Noticias -->
        <section class="news">
            <div class="news-header">
                <div class="news-title">Noticias</div>
                <div class="chips">
                    <span class="chip active">Todo</span>
                    <span class="chip">Actualizaciones</span>
                    <span class="chip">Eventos</span>
                </div>
            </div>

            <div class="news-list">
                <article class="card glass error">
                    <img class="icon" src="assets/images/icon.png" alt="">
                    <h3>Error <span class="tag">Sistema</span></h3>
                    <div class="date"><b>1</b>Enero</div>
                    <p>No se puede contactar con el servidor de noticias.<br>Por favor verifique su configuración.</p>
                </article>
            </div>
        </section>

        <!-- Barra inferior -->
        <footer class="bar">
            <div class="user">
                <img src="assets/images/steve.png" alt="">
                <div class="who"><b>Steve</b><small>Cuenta offline</small></div>
            </div>

            <div class="play">
                <div class="play-group">
                    <button class="btn-play">Jugar</button>
                    <button class="btn-more" title="Más opciones">▾</button>
                </div>
                <div class="progress-wrap">
                    <progress value="0" max="100"></progress>
                    <small>Listo para jugar</small>
                </div>
            </div>

            <div class="tools">
                <button class="icon-btn" title="Ajustes">⚙</button>
            </div>
        </footer>
    </main>

</body>
</html>
