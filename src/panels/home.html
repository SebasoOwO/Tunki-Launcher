<div class="container home-container">
    <div class="status-server">
        <img class="server-status-icon" src="assets/images/icon.png">
        <div class="server-status-infos">
            <div class="server-status-name">Minecraft</div>
            <div class="server-status-text">Activo - 0 ms</div>
        </div>
        <div class="status-player-count">
            <div class="player-count">0</div>
        </div>
    </div>

    <div class="home-bottom">
        <div class="new-tab store content-scroll">
            <!-- Destacado principal -->
            <section class="store-hero" style="--hero-img: none;">
                <div class="hero-content">
                    <span class="hero-tag">Destacado</span>
                    <h2 class="hero-title">Torneo EL HOYO</h2>
                    <p class="hero-text">Compite con la comunidad y gana premios exclusivos. Inscripciones abiertas hasta el 25 de octubre.</p>
                    <div class="hero-actions">
                        <button class="hero-btn primary">Jugar</button>
                    </div>
                </div>
                <div class="hero-dots"><i class="on"></i><i></i><i></i></div>
            </section>

            <!-- Fila de mosaicos -->
            <div class="store-row-title">Instancias</div>
            <div class="store-tiles"></div>


            <!-- Novedades (home.js sigue llenando .news-list) -->
            <div class="store-row-title">Novedades</div>
            <div class="news-list"></div>
        </div>
        <div class="social-tab">
            <div class="social-list content-scroll">
                
            </div>
        </div>
        <div class="extras-tab">
            <!-- Eventos -->
            <section class="extra-card events-card">
                <div class="extra-title"><span class="extra-bar"></span>Eventos</div>
                <div class="events-list content-scroll"></div>
            </section>

            <!-- Códigos -->
            <section class="extra-card codes-card">
                <div class="extra-title"><span class="extra-bar"></span>Códigos</div>
                <div class="code-form">
                    <input class="code-input" type="text" placeholder="Escribe tu código" maxlength="24" spellcheck="false">
                    <button class="code-redeem">Canjear</button>
                </div>
                <div class="code-message"></div>
                <div class="codes-list content-scroll">
                    <div class="code-chip" data-code="HOYO2026">
                        <span class="code-text">HOYO2026</span>
                        <span class="code-reward">Capa exclusiva</span>
                    </div>
                    <div class="code-chip" data-code="BIENVENIDO">
                        <span class="code-text">BIENVENIDO</span>
                        <span class="code-reward">Kit inicial</span>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <div class="sidebar">
        <div class="player-options">
            <div class="player-head"></div>
        </div>

        <div class="play-elements">
            <div class="play-instance">
                <button class="play-btn">Jugar</button>
                <div class="instance-select icon-arrow"></div>
            </div>
            <div class="info-starting-game">
                <div class="info-starting-game-text">Conexión...</div>
                <progress value="0" max="0" class="progress-bar"></progress>
            </div>
        </div>

        <div class="settings-btn icon-settings"></div>
    </div>

    <div class="instance-popup">
        <div class="instances-tab">
            <div class="close-popup icon-close"></div>
            <p>Elige tu instancia...</p>
            <div class="instances-List"></div>
        </div>
    </div>
</div>
